name: release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布的 tag"
        required: true
      dry_run:
        description: "只预检，不发布"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
          fetch-depth: 0

      - name: Cache uv
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2

      - name: Build
        run: |
          uv sync --frozen
          uv run python src/build.py 1440x3200

      - name: Release
        uses: KernelSU-Modules/tools/actions/module-release@b6d340ddcd562ad482568b6e66b8d7a9c34d645e
        with:
          zip: build/genshin-bootamin.zip
          tag: ${{ inputs.tag }}
          dry-run: ${{ inputs.dry_run }}
